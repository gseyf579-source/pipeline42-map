<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pipeline 42 — Live Theft & Drill Locator</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; }
    header { padding: 12px 16px; background: #1e293b; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 15px; margin: 0; }
    #map { height: 58vh; width: 100%; }
    .panel { padding: 12px 16px; }
    .btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    button { background: #dc2626; color: #fff; border: none; padding: 10px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    button.secondary { background: #2563eb; }
    #status { font-size: 13px; color: #93c5fd; word-break: break-word; }
  </style>
</head>
<body>
  <header>
    <h1>Pipeline 42 — Acoustic Drill Locator (±100m)</h1>
    <button class="secondary" onclick="loadData()">Refresh</button>
  </header>
  <div id="map"></div>
  <div class="panel">
    <div id="status">Loading stations & alerts...</div>
    <div class="btns">
      <button onclick="simulateDrill('KM_020', 1000, 'KM_040', 2500)">Test Drill @ KM 26.25</button>
      <button onclick="simulateDrill('KM_060', 3200, 'KM_080', 1600)">Test Drill @ KM 74.00</button>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz41bao2Euol2Ym_KPeBOrWfnFxqiS4V5nXXYC2g8yqFMVK6dCECF1ZuOdO-tOpWXGh/exec";

    const map = L.map("map").setView([33.65, 44.72], 9);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "© OpenStreetMap"
    }).addTo(map);

    const layerGroup = L.layerGroup().addTo(map);

    async function loadData() {
      const statusEl = document.getElementById("status");
      statusEl.textContent = "Loading stations & alerts...";
      try {
        const res = await fetch(SCRIPT_URL + "?t=" + Date.now());
        const data = await res.json();
        if (!data.ok) {
          statusEl.textContent = "Script error: " + (data.error || "Unknown error");
          return;
        }

        layerGroup.clearLayers();
        const lineCoords = (data.stations || []).map(s => [s.lat, s.lng]);
        if (lineCoords.length > 1) {
          L.polyline(lineCoords, { color: "#38bdf8", weight: 4 }).addTo(layerGroup);
        }

        (data.stations || []).forEach(s => {
          L.circleMarker([s.lat, s.lng], { radius: 6, color: "#0284c7", fillOpacity: 1 })
            .bindPopup("<b>" + s.id + "</b><br>Marker: " + s.km + " km")
            .addTo(layerGroup);
        });

        (data.alerts || []).forEach(a => {
          const redIcon = L.divIcon({
            html: '<div style="background:#ef4444;width:16px;height:16px;border-radius:50%;border:3px solid #fff;"></div>',
            iconSize: [22, 22]
          });
          L.marker([a.lat, a.lng], { icon: redIcon })
            .bindPopup("<b>" + a.status + "</b><br>Location: <b>KM " + a.km + "</b> (±100m)<br>Nodes: " + a.nodeA + " ↔ " + a.nodeB)
            .addTo(layerGroup);
        });

        statusEl.textContent = "Loaded " + data.stations.length + " stations & " + data.alerts.length + " alerts.";
      } catch (err) {
        statusEl.textContent = "Load failed: " + err.message;
      }
    }

    async function simulateDrill(nodeA, timeA, nodeB, timeB) {
      const statusEl = document.getElementById("status");
      statusEl.textContent = "Sending alert...";
      try {
        const url = SCRIPT_URL + "?action=alert&nodeA=" + encodeURIComponent(nodeA) +
          "&timeA=" + timeA + "&nodeB=" + encodeURIComponent(nodeB) +
          "&timeB=" + timeB + "&status=DRILL_DETECTED&t=" + Date.now();
        const res = await fetch(url);
        const out = await res.json();
        if (!out.ok) {
          statusEl.textContent = "Alert error: " + (out.error || "Failed");
          return;
        }
        statusEl.textContent = "Logged at KM " + out.km + " (" + out.lat + ", " + out.lng + ")";
        await loadData();
      } catch (err) {
        statusEl.textContent = "Send failed: " + err.message;
      }
    }

    loadData();
  </script>
</body>
</html>
